<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1.0"/><title>Aum Textile — Premium Institutional Linen</title><link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300;1,400&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet"/><style>/* ── RESET & TOKENS ── */*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}:root{  --ink:#111009;--charcoal:#1C1C1C;--warm-white:#F7F5F0;--off-white:#FAFAF7;  --linen:#EDE8DF;--gold:#C9A84C;--gold-light:#E2C97A;--muted:#8A8070;  --border:rgba(0,0,0,0.08);--glass:rgba(255,255,255,0.12);  --radius:2px;  --ease:cubic-bezier(0.25,0.46,0.45,0.94);}html{scroll-behavior:smooth;font-size:16px}body{font-family:'DM Sans',sans-serif;background:var(--off-white);color:var(--ink);overflow-x:hidden}img{display:block;max-width:100%}a{text-decoration:none;color:inherit} /* ── UTILITY ── */.u-tag{font-size:0.62rem;letter-spacing:0.25em;text-transform:uppercase;color:var(--gold)}.u-serif{font-family:'Cormorant Garamond',serif}.u-muted{color:var(--muted)} /* ══════════════════════════════════════   NAV══════════════════════════════════════ */.nav{  position:fixed;top:0;left:0;right:0;z-index:500;  display:flex;align-items:center;justify-content:space-between;  padding:1.1rem 3.5rem;  background:rgba(250,250,247,0.9);  backdrop-filter:blur(20px) saturate(1.4);  -webkit-backdrop-filter:blur(20px) saturate(1.4);  border-bottom:1px solid var(--border);  transition:padding .3s var(--ease);}.nav.scrolled{padding:.8rem 3.5rem}.nav-logo{font-family:'Cormorant Garamond',serif;font-size:1.45rem;font-weight:600;letter-spacing:.06em;display:flex;align-items:center;gap:.4rem}.nav-logo-mark{color:var(--gold);font-size:1rem}.nav-links{display:flex;gap:2.5rem;list-style:none}.nav-links a{font-size:.72rem;letter-spacing:.18em;text-transform:uppercase;color:var(--muted);transition:color .2s}.nav-links a:hover{color:var(--ink)}.nav-right{display:flex;align-items:center;gap:1.2rem}.nav-pill{  font-size:.68rem;letter-spacing:.14em;text-transform:uppercase;  border:1px solid var(--ink);padding:.5rem 1.2rem;  transition:all .2s var(--ease);cursor:pointer;background:transparent;  font-family:'DM Sans',sans-serif;color:var(--ink);}.nav-pill:hover,.nav-pill.filled{background:var(--ink);color:#fff}.nav-pill.filled:hover{background:var(--charcoal)} /* ══════════════════════════════════════   HERO══════════════════════════════════════ */.hero{position:relative;height:100vh;overflow:hidden;background:var(--charcoal)}.hero-track{  display:flex;height:100%;  transition:transform .9s var(--ease);</style></head><body>
<nav class="nav">
  <a class="nav-logo" href="#"><span class="nav-logo-mark">✦</span> Aum Textile</a>
  <ul class="nav-links"><li><a href="#">Collections</a></li><li><a href="#">The House</a></li><li><a href="#">Journal</a></li></ul>
  <div class="nav-right"><button class="nav-pill">Enquire</button><button class="nav-pill filled">View Collection</button></div>
</nav>
<main>
  <section class="hero" style="display:flex;align-items:center;">
    <div class="hero-track" style="width:100%;align-items:center;">
      <div style="padding:8rem 8vw;color:#F7F5F0;max-width:760px;">
        <div class="u-tag" style="margin-bottom:1.5rem;">Premium institutional linen</div>
        <h1 class="u-serif" style="font-size:clamp(3.5rem,8vw,7rem);font-weight:300;line-height:.9;letter-spacing:-.03em;">Textiles with<br><em>quiet presence.</em></h1>
        <p style="margin-top:2rem;color:#bcb5aa;max-width:420px;line-height:1.8;font-size:.9rem;">A visual preview built from the styling available in the attached file. The original source ends before its page content begins.</p>
        <button class="nav-pill" style="margin-top:2.2rem;border-color:#E2C97A;color:#E2C97A;">Explore the collection</button>
      </div>
      <div aria-hidden="true" style="position:absolute;right:8vw;bottom:10vh;width:min(28vw,360px);height:min(48vh,520px);border:1px solid rgba(226,201,122,.45);background:linear-gradient(145deg,rgba(226,201,122,.16),rgba(255,255,255,.03));transform:rotate(7deg);"></div>
    </div>
  </section>
  <div style="position:fixed;left:1rem;bottom:1rem;background:rgba(17,16,9,.9);color:#E2C97A;padding:.7rem 1rem;font:500 .65rem 'DM Sans',sans-serif;letter-spacing:.12em;text-transform:uppercase;z-index:10;">Partial-source preview</div>
</main>
</body></html>
